<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDev Master AI</title>
    <script>
      // Automatically silence uninformative "Script error." issues from iframe or cross-origin scripts
      window.onerror = function (message, url, line, col, error) {
        if (message && (message.indexOf("Script error") !== -1 || message.indexOf("Script error.") !== -1)) {
          console.warn("Silenced cross-origin opaque script error:", message);
          return true; // prevent error bubbling/registering in test engines
        }
        return false;
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>

  </body>
